<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公司活動自拍神器 Virtual Photobooth</title>
  <!-- 引入 QR Code 生成庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 { margin-bottom: 15px; color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
    
    .booth-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 4px solid #333;
    }

    video, canvas, #overlay-img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    /* 鏡頭鏡像翻轉，自拍更自然 */
    video { transform: scaleX(-1); }

    #overlay-img {
      pointer-events: none;
      z-index: 2;
    }

    /* 倒數計時覆蓋層 */
    #countdown {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 120px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 20px #ff0055, 0 0 40px #ff0055;
      z-index: 10;
      display: none;
    }

    /* 閃光燈效果 */
    #flash {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: white;
      opacity: 0;
      z-index: 20;
      pointer-events: none;
      transition: opacity 0.1s ease-out;
    }

    /* 控制面板 */
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 800px;
    }

    button, label.btn {
      background: linear-gradient(135deg, #ff007f, #7928ca);
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
      transition: all 0.2s ease;
      display: inline-block;
    }

    button:hover, label.btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 0, 127, 0.6);
    }

    button:disabled {
      background: #555;
      box-shadow: none;
      cursor: not-allowed;
    }

    input[type="file"] { display: none; }

    /* Modal 彈出視窗（顯示照片與 QR Code） */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .modal-content {
      background: #222;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      max-width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 0 20px rgba(255,215,0,0.3);
    }

    .result-flex {
      display: flex;
      gap: 20px;
      margin: 20px 0;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    #captured-img {
      max-width: 360px;
      border-radius: 10px;
      border: 2px solid #555;
    }

    .qr-box {
      background: white;
      padding: 15px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .qr-box p { color: #333; margin-top: 8px; font-weight: bold; font-size: 14px; }
  </style>
</head>
<body>

  <h1>📸 公司 Photobooth 自拍神器</h1>

  <div class="booth-container">
    <video id="video" autoplay playsinline></video>
    <img id="overlay-img" src="" alt="" style="display:none;">
    <div id="countdown">3</div>
    <div id="flash"></div>
  </div>

  <div class="controls">
    <button id="snap-btn" onclick="startCountdown()">📸 開始拍照 (3秒倒數)</button>
    <label for="frame-upload" class="btn" style="background: linear-gradient(135deg, #0070f3, #00dfd8);">
      🖼️ 上傳 PNG 相框
    </label>
    <input type="file" id="frame-upload" accept="image/png" onchange="loadOverlay(event)">
  </div>

  <!-- 隱藏的 Canvas 用於合成影像 -->
  <canvas id="canvas" style="display:none;"></canvas>

  <!-- 照片結果與 QR Code Modal -->
  <div id="result-modal" class="modal">
    <div class="modal-content">
      <h2>🎉 拍照成功！</h2>
      <div class="result-flex">
        <img id="captured-img" src="" alt="Captured Photo">
        <div class="qr-box">
          <div id="qrcode"></div>
          <p>📱 手機掃碼下載照片</p>
        </div>
      </div>
      <button onclick="closeModal()" style="background: #444;">返回再拍一張</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const overlayImg = document.getElementById('overlay-img');
    const countdownEl = document.getElementById('countdown');
    const flashEl = document.getElementById('flash');
    const resultModal = document.getElementById('result-modal');
    const capturedImg = document.getElementById('captured-img');
    const qrcodeContainer = document.getElementById('qrcode');
    const snapBtn = document.getElementById('snap-btn');

    // 1. 啟動鏡頭
    navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 960, facingMode: "user" }, audio: false })
      .then(stream => { video.srcObject = stream; })
      .catch(err => {
        alert("無法讀取鏡頭，請確保已授權相機權限！");
        console.error(err);
      });

    // 2. 載入自訂相框 (PNG)
    function loadOverlay(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          overlayImg.src = e.target.result;
          overlayImg.style.display = 'block';
        }
        reader.readAsDataURL(file);
      }
    }

    // 3. 倒數計時邏輯
    function startCountdown() {
      snapBtn.disabled = true;
      let count = 3;
      countdownEl.innerText = count;
      countdownEl.style.display = 'block';

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          countdownEl.innerText = count;
        } else {
          clearInterval(timer);
          countdownEl.style.display = 'none';
          takePhoto();
          snapBtn.disabled = false;
        }
      }, 1000);
    }

    // 4. 拍照與圖像合成
    function takePhoto() {
      // 閃光燈動畫
      flashEl.style.opacity = '1';
      setTimeout(() => { flashEl.style.opacity = '0'; }, 150);

      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 960;

      // 繪製鏡頭畫面（需鏡像翻轉回來）
      ctx.save();
      ctx.scale(-1, 1);
      ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
      ctx.restore();

      // 如果有上傳相框，疊加相框
      if (overlayImg.src && overlayImg.style.display !== 'none') {
        ctx.drawImage(overlayImg, 0, 0, canvas.width, canvas.height);
      }

      // 生成 Base64 圖片
      const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
      capturedImg.src = dataUrl;

      // 生成 QR Code
      qrcodeContainer.innerHTML = "";
      new QRCode(qrcodeContainer, {
        text: dataUrl,
        width: 160,
        height: 160
      });

      // 顯示 Modal
      resultModal.style.styleDisplay = 'flex';
      resultModal.style.display = 'flex';
    }

    function closeModal() {
      resultModal.style.display = 'none';
    }
  </script>
</body>
</html>
